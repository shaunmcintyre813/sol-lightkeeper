name: Publish Sol

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check puzzle routes and cache isolation
        run: node --test tests/*.test.mjs
      - name: Check complete update manifest
        run: node tools/update-manifest.mjs --check
      - name: Check native update rollback
        run: |
          mkdir -p android/build/native-tests
          javac --release 11 -d android/build/native-tests android/src/com/shaunmcintyre/sol/lightkeeper/UpdateStore.java tests/UpdateStoreTest.java
          java -cp android/build/native-tests UpdateStoreTest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
