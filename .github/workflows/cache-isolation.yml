name: Maintenance checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check puzzles and service-worker cache isolation
        run: node --test tests/*.test.mjs
      - name: Check complete content-update manifest
        run: node tools/update-manifest.mjs --check
      - name: Check native update rollback
        run: |
          mkdir -p android/build/native-tests
          javac --release 11 -d android/build/native-tests android/src/com/shaunmcintyre/sol/lightkeeper/UpdateStore.java tests/UpdateStoreTest.java
          java -cp android/build/native-tests UpdateStoreTest
